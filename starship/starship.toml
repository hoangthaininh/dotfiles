"$schema" = 'https://starship.rs/config-schema.json'
# Two-line Claude Code-style prompt, warm coral palette.
# Line 1: 泰蛟 + cwd + git (left), runtime (right edge). Line 2: ✻ cursor.

add_newline = true
command_timeout = 2000   # covers the first "cold" git status in repos with a large working tree
scan_timeout = 30
palette = "claude"

# No frame. 泰蛟 leads the line, then the path; an invisible (space) fill right-aligns runtime.
# $container shows only inside a container; $status shows the exit code on failure.
format = """
$username$hostname$container[⚘ ](coral)$directory$git_branch$git_commit$git_status$git_state$fill$nodejs$python$rust$golang$c$docker_context$cmd_duration
$status$character """

[fill]
symbol = " "

[username]   # user@host shows only over SSH or as root
format = "[$user]($style)[@](dim)"
style_user = "coral"
style_root = "red"
show_always = false

[hostname]
ssh_only = true
format = "[$hostname]($style)[ ](dim)"
style = "yellow"

[directory]   # fish-style: parent dirs shrink to one char, current dir stays full
format = "[$path]($style)"
style = "bold cream"
truncation_length = 1
fish_style_pwd_dir_length = 1
truncate_to_repo = true
read_only = "  "
read_only_style = "coral"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "muted"
truncation_length = 24
truncation_symbol = "…"

[git_commit]   # detached HEAD -> short SHA; also shows tags
only_detached = true
tag_disabled = false
tag_symbol = " "
format = "[@$hash$tag]($style) "
style = "muted"

[git_status]   # symbol order = order to deal with them
style = "dim"
format = "[$conflicted$ahead_behind$staged$modified$renamed$deleted$untracked$stashed]($style)"
conflicted = "✖${count} "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
staged     = "+${count} "
modified   = "!${count} "
renamed    = "»${count} "
deleted    = "✘${count} "
untracked  = "?${count} "
stashed    = "≡${count} "

[git_state]   # in-progress rebase / merge / cherry-pick
format = '[ $state( $progress_current/$progress_total)]($style)'
style = "bold red"

[character]   # ⚊⚋ cursor, turns red when the previous command failed
success_symbol = "[⚊泰蛟⚋](bold coral)"
error_symbol   = "[⚊泰蛟⚋](bold red)"
vicmd_symbol   = "[⚊泰蛟⚋](bold yellow)"

[status]   # exit code + signal name, only on failure
disabled = false
recognize_signal_code = true
format = "[$status( $signal_name)]($style) "
style = "bold red"

[container]   # shows only when inside a container / devcontainer
format = "[$symbol$name]($style) "
symbol = "󰡨 "
style = "yellow"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "dim"

[python]
symbol = " "
format = '[$symbol$version( \($virtualenv\))]($style) '
style = "dim"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "dim"

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "dim"

[c]
symbol = " "
format = "[$symbol$version]($style) "
style = "dim"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "dim"
only_with_files = true

[cmd_duration]
min_time = 2000
format = "[ $duration]($style)"
style = "dim italic"

# Disable unused modules to keep the prompt instant.
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[kubernetes]
disabled = true
[package]
disabled = true
[battery]
disabled = true
[memory_usage]
disabled = true
[time]
disabled = true

[palettes.claude]
coral  = "#D9773C"   # accent: 泰蛟, cursor, user
cream  = "#EAE6DA"   # directory
muted  = "#9A968C"   # git branch / commit
dim    = "#6E6A62"   # git status, runtime
yellow = "#D9A441"   # hostname
red    = "#E0574B"   # errors / danger states
