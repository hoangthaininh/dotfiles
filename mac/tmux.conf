# tmux configuration for the work Mac — reached over SSH from Fedora.
#
# This is NOT a copy of ../tmux/tmux.conf. Same muscle memory where it ports
# cleanly, but three things on that machine do not exist here:
#
#   wl-copy       Wayland only          → pbcopy
#   `tp` popup    a zsh function from ../zsh/functions/, not installed here
#   NO_FLOW_CONTROL  set by ../zsh/conf.d/options.zsh, not by this Mac's zsh
#
# Lives at ~/.config/tmux/tmux.conf (XDG, honoured since tmux 3.1), matching
# the Fedora side. Reload with prefix + r.
#
# Deploy: see mac/README.md

# ── prefix ────────────────────────────────────────────────────────────────────
# C-s to match Fedora, so the reflex carries across machines. Caveat specific to
# this Mac: its zsh does NOT disable XON/XOFF, so a LITERAL C-s sent through to
# the shell (prefix twice) freezes the pane until you press C-q. tmux itself is
# unaffected — it reads its client terminal in raw mode, where IXON is off.
# Bothered by it? `echo 'stty -ixon' >> ~/.zshrc` on this Mac.
set  -g prefix C-s
unbind C-b
bind C-s send-prefix

# ── terminal ──────────────────────────────────────────────────────────────────
set  -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set  -g allow-passthrough on
set  -g focus-events on
set  -sg escape-time 10       # the 500ms default makes ESC feel broken over SSH
set  -g history-limit 50000   # reading a long log should not lose the start
set  -g display-time 2000

# ── behaviour ─────────────────────────────────────────────────────────────────
set  -g mouse on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g allow-rename off
set  -g detach-on-destroy off
set  -g set-titles on
set  -g set-titles-string "#S · #W"

# ── copy mode ─────────────────────────────────────────────────────────────────
# pbcopy instead of wl-copy. No reattach-to-user-namespace wrapper: that was
# needed on macOS 10.x, and this is 15.7 where pbcopy works from tmux directly.
# set-clipboard also emits OSC 52, so a copy here reaches the Fedora clipboard
# through the SSH session — which is the whole point of using this from afar.
setw -g mode-keys vi
set  -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Escape send -X cancel

# ── splits and windows ────────────────────────────────────────────────────────
# All three inherit the current pane's directory; tmux does not do that by default.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# ── navigation ────────────────────────────────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind BSpace last-window

# ── popups ────────────────────────────────────────────────────────────────────
# No prefix+G here: it runs `tp`, a zsh function that lives on Fedora only.
# prefix+S — switch between running sessions. '=' forces an exact name match.
bind S display-popup -E -w 50% -h 40% \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session ❯ ' \
   | xargs -r -I{} tmux switch-client -t '={}'"

# prefix+Enter — throwaway shell in this pane's directory.
bind Enter display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# ── misc ──────────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  config reloaded"
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# ── status bar ────────────────────────────────────────────────────────────────
# Top, not bottom: starship is installed here too and its prompt is two lines
# tall, so a bottom status bar collides with it. Same "claude" palette as the
# Fedora side, so both machines read as one system — and the hostname in
# status-right is what tells you which one you are actually looking at.
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#6E6A62"

set -g status-left-length 40
set -g status-left "#[fg=#D9773C,bold] ⚘ #S #[fg=#6E6A62]#{?client_prefix,#[fg=#E0574B\\,bold]● ,}"

set -g status-right-length 80
set -g status-right "#[fg=#9A968C]#{b:pane_current_path} #[fg=#6E6A62]│ #[fg=#D9A441]mac #[fg=#6E6A62]│ %a %d/%m %H:%M "

set -g window-status-format         "#[fg=#6E6A62] #I #W "
set -g window-status-current-format "#[fg=#D9773C,bold] #I #W "
set -g window-status-activity-style "fg=#D9A441"

set -g pane-border-style        "fg=#3A3835"
set -g pane-active-border-style "fg=#D9773C"

set -g message-style "bg=default,fg=#D9773C,bold"
set -g mode-style    "bg=#D9773C,fg=#1C1B1A"
