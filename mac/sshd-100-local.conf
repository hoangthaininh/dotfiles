# Local SSH hardening. Read before 100-macos.conf (lexical order), and OpenSSH
# takes the FIRST value for each keyword, so these win.
PubkeyAuthentication yes
PasswordAuthentication no

# Required, not optional: 100-macos.conf sets UsePAM yes, and PAM offers
# keyboard-interactive as a separate path that PasswordAuthentication no does
# not close. Without this line the machine still accepts a typed password.
KbdInteractiveAuthentication no

PermitRootLogin no
AllowUsers comacpro
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 30
ClientAliveCountMax 3
