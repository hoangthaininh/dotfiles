# tmux configuration — XDG-native (~/.config/tmux/tmux.conf, honoured since 3.1).
# Reload with prefix + r.
#
# Design rules this file follows:
#   1. No plugin manager. tpm adds a bootstrap step, a network dependency and
#      version drift to a tool whose whole value is being there when everything
#      else is broken. Everything here is a tmux built-in.
#   2. Every binding replaces something. A rebind is only worth it when the thing
#      displaced is used less than the thing gained; where that is close, the
#      comment says what was given up.
#   3. Nothing writes state to disk. A layout that rebuilds identically every time
#      beats one that restores whatever you happened to leave behind — see the
#      note on persistence at the bottom.

# ── prefix ────────────────────────────────────────────────────────────────────
# C-s, not the default C-b. In this zsh (emacs mode) C-b is backward-char, C-a is
# beginning-of-line, C-Space is autosuggest-accept and C-t is fzf-file-widget —
# all live. C-s is normally terminal flow control (XOFF), which would freeze the
# pane, but conf.d/options.zsh sets NO_FLOW_CONTROL, so it is genuinely free.
# What is given up: zsh's forward-i-search, already redundant next to fzf's C-r.
set  -g prefix C-s
unbind C-b
bind C-s send-prefix          # press it twice to send a literal C-s through

# ── terminal ──────────────────────────────────────────────────────────────────
# Ptyxis reports xterm-256color but does support truecolor; without the RGB
# declaration tmux degrades colours to 256 and the starship palette shifts.
set  -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

set  -g allow-passthrough on  # let sixel / kitty-graphics / OSC reach the app
set  -g focus-events on       # editors see FocusGained and reload changed files
set  -sg escape-time 10       # the 500ms default makes ESC feel broken; 0 breaks
                              # some terminals that send real escape sequences
set  -g history-limit 50000
set  -g display-time 2000

# ── behaviour ─────────────────────────────────────────────────────────────────
set  -g mouse on              # drag borders, scroll, click panes.
                              # Trade-off: this captures terminal-native selection.
                              # Hold Shift while dragging to select text the normal
                              # way when you want the emulator's clipboard instead.
set  -g base-index 1          # windows and panes count from 1, matching the keys
setw -g pane-base-index 1
set  -g renumber-windows on   # closing window 2 of 3 leaves 1,2 — not 1,3
set  -g allow-rename off      # programs may not rename windows via escape codes
set  -g detach-on-destroy off # killing a project's session lands you in another
set  -g set-titles on
set  -g set-titles-string "#S · #W"

# ── copy mode ─────────────────────────────────────────────────────────────────
# vi keys here are independent of the shell's emacs mode on purpose: copy mode is
# modal navigation, which is what vi keys are actually good at.
# wl-copy for Wayland; set-clipboard also emits OSC 52, so copying works over SSH.
setw -g mode-keys vi
set  -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Escape send -X cancel

# ── splits and windows ────────────────────────────────────────────────────────
# | and - mirror the split direction visually. All three inherit the current
# pane's directory, which tmux does NOT do by default — its worst stock behaviour.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# ── navigation ────────────────────────────────────────────────────────────────
# Alt is entirely free in this zsh config, so these need no prefix at all.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

# -r = repeatable: hold prefix once, then tap H/J/K/L to keep resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind BSpace last-window

# ── popups ────────────────────────────────────────────────────────────────────
# prefix+G — jump to a project, creating its session if it is not running. This is
# the `tp` function from ~/.config/zsh/functions/tp, so it needs an interactive
# zsh to be autoloaded; -i is what costs the ~100ms and is unavoidable here.
bind G display-popup -E -w 70% -h 60% "zsh -ic tp"

# prefix+S — switch between sessions already running. Cheaper than prefix+G when
# everything you want is open: no repo scan, just the live list.
# '=' forces an exact match so "cmp" cannot resolve to "cmp-sm-fe".
bind S display-popup -E -w 50% -h 40% \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session ❯ ' \
   | xargs -r -I{} tmux switch-client -t '={}'"

# prefix+Enter — throwaway shell in this pane's directory, for the one-off command
# you do not want to stop a running process for.
bind Enter display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# ── misc ──────────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  config reloaded"
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# ── status bar ────────────────────────────────────────────────────────────────
# Top, not bottom: the starship prompt is two lines tall and sits at the bottom,
# so a bottom status bar collides with it. Colours come from the "claude" palette
# in ~/.config/starship/starship.toml, so prompt and status read as one system.
# status-interval 5 rather than the default 15 — the clock is the only live field
# and a 15-second-stale clock is worse than useless.
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#6E6A62"

set -g status-left-length 40
set -g status-left "#[fg=#D9773C,bold] ⚘ #S #[fg=#6E6A62]#{?client_prefix,#[fg=#E0574B\\,bold]● ,}"

set -g status-right-length 60
set -g status-right "#[fg=#9A968C]#{b:pane_current_path} #[fg=#6E6A62]│ %a %d/%m %H:%M "

set -g window-status-separator ""
set -g window-status-format         "#[fg=#6E6A62] #I #W "
set -g window-status-current-format "#[fg=#D9773C,bold] #I #W "
set -g window-status-activity-style "fg=#D9A441"

set -g pane-border-lines heavy
set -g pane-border-style        "fg=#3A3835"
set -g pane-active-border-style "fg=#D9773C"

set -g message-style "bg=default,fg=#D9773C,bold"
set -g mode-style    "bg=#D9773C,fg=#1C1B1A"

# ── on persistence ────────────────────────────────────────────────────────────
# There is deliberately no tmux-resurrect, no tmux-continuum and no auto-save hook
# here. A tmux session lives in the server's memory and dies with the machine;
# nothing on disk survives a reboot but the socket. Two ways to answer that:
#
#   restore   snapshot the live session, replay it later. Captures arrangements
#             you made by hand — and also stale directories, dead branches and
#             scrollback that reads like live output but is a screenshot. What you
#             get back depends on what you last happened to leave open.
#   rebuild   describe the session in code and run it again. Cannot bring back an
#             ad-hoc arrangement, but always produces exactly one known result, on
#             any machine, from a file that lives in git.
#
# This setup rebuilds: `tp` makes the same two windows every time. The cost is
# real — a layout you hand-tuned yesterday is gone. The gain is that after a
# reboot you never wonder which state you are looking at.
