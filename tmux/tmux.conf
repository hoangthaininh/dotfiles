# tmux configuration — XDG-native path (~/.config/tmux/tmux.conf, honoured since 3.1).
# Companion to ~/.config/zsh. Reload with: prefix + r
#
# Prefix is C-s, NOT the default C-b. This shell runs zsh in emacs mode where
# C-b = backward-char, C-a = beginning-of-line, C-Space = autosuggest-accept and
# C-t = fzf-file-widget — all live bindings. C-s is zsh's forward incremental
# search, made redundant by fzf's C-r, so it is the only cheap key left.
# Press C-s twice to send a literal C-s through to the shell.

# ── prefix ────────────────────────────────────────────────────────────────────
set  -g prefix C-s
unbind C-b
bind C-s send-prefix

# ── terminal ──────────────────────────────────────────────────────────────────
# Ptyxis reports xterm-256color but does support truecolor, so declare RGB or
# tmux degrades colours to 256 and the starship palette shifts. terminal-features
# is the modern replacement for the old terminal-overrides hack.
set  -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"    # in case you switch emulators
set  -g allow-passthrough on     # let sixel / kitty-graphics / OSC reach the app
set  -g focus-events on          # vim autoread + FocusGained work
set  -sg escape-time 10          # the 500ms default makes ESC feel broken in vim
set  -g history-limit 50000
set  -g display-time 2000

# ── behaviour ─────────────────────────────────────────────────────────────────
set  -g mouse on                 # drag borders to resize, scroll, click panes
set  -g base-index 1             # windows/panes count from 1, matching the keyboard
setw -g pane-base-index 1
set  -g renumber-windows on      # closing window 2 of 3 leaves 1,2 — not 1,3
# automatic-rename stays ON: tmux disables it per-window as soon as a name is given
# with -n, so `tp`'s code/run/git names stick, while a window you open yourself with
# prefix+c still shows the command it is running instead of a permanent "zsh".
set  -g allow-rename off         # but don't let programs rename via escape sequences
set  -g detach-on-destroy off    # killing a project session lands you in another,
                                 # instead of kicking you out of tmux entirely
set  -g set-titles on
set  -g set-titles-string "#S · #W"

# ── copy mode ─────────────────────────────────────────────────────────────────
# vi keys here are deliberate and independent of the shell's emacs mode: copy mode
# is modal navigation, which is what vi keys are good at. Wayland clipboard via
# wl-copy; set-clipboard also emits OSC 52 so copying works over SSH.
setw -g mode-keys vi
set  -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Escape send -X cancel

# ── splits ────────────────────────────────────────────────────────────────────
# | and - mirror the split direction visually. Both inherit the pane's cwd, which
# tmux does NOT do by default — the single most annoying stock behaviour.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# ── navigation ────────────────────────────────────────────────────────────────
# Alt+arrows need no prefix (Alt is entirely free in this zsh config).
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -r = repeatable: hold the prefix once, then tap H/J/K/L to keep resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

# ── popups ────────────────────────────────────────────────────────────────────
# prefix+Enter: throwaway shell in the current pane's directory — for the one-off
# command you don't want to lose your running process for.
bind Enter display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# prefix+S: fzf session switcher. '=' forces an exact name match so a session
# named "api" can't accidentally attach to "api-gateway".
bind S display-popup -E -w 50% -h 40% \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session ❯ ' \
   | xargs -r -I{} tmux switch-client -t '={}'"

# prefix+G: jump to a project, creating its session if needed (the `tp` function
# from ~/.config/zsh/functions/tp — needs an interactive zsh to be autoloaded).
bind G display-popup -E -w 70% -h 60% "zsh -ic tp"

# ── misc bindings ─────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  config reloaded"
bind e setw synchronize-panes \; display "  sync-panes #{?pane_synchronized,ON,off}"
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind BSpace last-window

# ── status bar ────────────────────────────────────────────────────────────────
# Positioned at the top on purpose: the starship prompt is two lines tall and sits
# at the bottom, so a bottom status bar collides with it visually.
# Colours are the "claude" palette from ~/.config/starship/starship.toml, so the
# prompt and the status bar read as one system.
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#6E6A62"

set -g status-left-length 40
set -g status-left "#[fg=#D9773C,bold] ⚘ #S #[fg=#6E6A62]#{?client_prefix,#[fg=#E0574B\\,bold]● ,}"

set -g status-right-length 60
set -g status-right "#[fg=#9A968C]#{b:pane_current_path} #[fg=#6E6A62]│ %a %d/%m %H:%M "

set -g window-status-separator ""
set -g window-status-format         "#[fg=#6E6A62] #I #W "
set -g window-status-current-format "#[fg=#D9773C,bold] #I #W "
set -g window-status-activity-style "fg=#D9A441"

set -g pane-border-lines heavy
set -g pane-border-style        "fg=#3A3835"
set -g pane-active-border-style "fg=#D9773C"

set -g message-style "bg=default,fg=#D9773C,bold"
set -g mode-style    "bg=#D9773C,fg=#1C1B1A"
